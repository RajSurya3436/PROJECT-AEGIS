# Read by `streamlit run` when started from the project folder. Overrides unsafe defaults.

[server]
# Streamlit's default is every network interface; this app holds security data, so only
# this machine may connect.
address = "127.0.0.1"
port = 8501
headless = true
enableXsrfProtection = true
enableCORS = true
# Matches MAX_UPLOAD_BYTES (25 MB); the app enforces its own limit as well.
maxUploadSize = 25

[browser]
# Streamlit sends usage statistics by default; this app promises nothing leaves the machine.
gatherUsageStats = false

[theme]
# Dark SOC console. Fonts are the system defaults so no font is fetched from the internet.
base = "dark"
primaryColor = "#4f8cff"
backgroundColor = "#0b1020"
secondaryBackgroundColor = "#131b30"
textColor = "#e6eaf2"
borderColor = "#24304d"
baseRadius = "0.6rem"
showWidgetBorder = true
chartCategoricalColors = ["#4f8cff", "#34d399", "#fb923c", "#f43f5e", "#a78bfa", "#facc15", "#38bdf8", "#94a3b8"]

[theme.sidebar]
backgroundColor = "#0e1528"
secondaryBackgroundColor = "#17213b"

[client]
# Uncaught errors show a generic message, not a stack trace with file paths and values.
showErrorDetails = "none"
toolbarMode = "minimal"
